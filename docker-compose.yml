# Local development services. PHP and Node run on your machine; only Postgres runs in Docker.
services:
    postgres:
        image: postgres:17
        container_name: voxtopia-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: voxtopia
            POSTGRES_USER: voxtopia
            POSTGRES_PASSWORD: secret # local development only
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U voxtopia -d voxtopia']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    pgdata:
